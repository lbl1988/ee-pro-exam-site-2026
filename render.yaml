services:
  - type: static_site
    name: ee-pro-exam-site-2026
    buildCommand: echo "No build needed for static site"
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
